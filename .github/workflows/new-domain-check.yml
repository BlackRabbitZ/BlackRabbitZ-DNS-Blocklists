name: New domain DNS check

on:
  pull_request:
    paths:
      - 'lists/categories/**'

permissions:
  contents: read

jobs:
  dns-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: PR-Branch auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Neu hinzugefügte Domains auf NXDOMAIN prüfen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 ./scripts/automation/new_domain_check.py \
            --diff-range "$BASE_SHA...HEAD" \
            --fail-on-nxdomain \
            --max-domains 25000 \
            --workers 32 \
            --timeout 2 \
            --report /tmp/new-domain-dns.json

      - name: DNS-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-domain-dns-report
          path: /tmp/new-domain-dns.json
          if-no-files-found: ignore
          retention-days: 14
