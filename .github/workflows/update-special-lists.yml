name: Update extended lists

on:
  workflow_dispatch:
    inputs:
      include_heavy:
        description: 'Große NRD/DGA-Listen mitbauen / Build large NRD/DGA lists'
        required: true
        default: true
        type: boolean
      force_rebuild:
        description: 'Archivquellen neu laden / Re-download archive sources'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  extended-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate extended-list configuration
        run: python3 -m json.tool config/special-lists.json >/dev/null

      - name: Remove Python cache artifacts
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Build extended lists
        shell: bash
        env:
          INCLUDE_HEAVY: ${{ inputs.include_heavy }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          args=()
          if [[ "$INCLUDE_HEAVY" == "true" ]]; then
            args+=(--include-heavy)
          fi
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            args+=(--force)
          fi
          python3 ./scripts/update-special-lists.py "${args[@]}"

      - name: Rebuild profiles, metadata and READMEs
        shell: bash
        run: bash ./scripts/update-lists.sh

      - name: Validate generated diff
        run: git diff --check

      - name: Commit extended lists
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Extended lists are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: update extended blocklists"
          git push
