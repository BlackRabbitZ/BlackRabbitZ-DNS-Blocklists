name: Issue triage

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  setup-labels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Benötigte Triage-Labels anlegen oder aktualisieren
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = [
              ['already-included', '2da44e', 'Domain ist bereits enthalten'],
              ['dead-domain', '6e7781', 'Domain existiert nicht mehr / bestätigtes NXDOMAIN'],
              ['duplicate', 'cfd3d7', 'Doppelte Meldung'],
              ['invalid-report', 'd73a4a', 'Meldung enthält nicht genügend prüfbare Angaben'],
              ['fixed-pending-release', '1d76db', 'Fix ist vorbereitet und wartet auf Release'],
              ['wontfix', 'ffffff', 'Änderung ist derzeit nicht geplant']
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.getLabel({owner, repo, name});
                await github.rest.issues.updateLabel({owner, repo, name, new_name: name, color, description});
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({owner, repo, name, color, description});
              }
            }

  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Issue anhand des Labels bearbeiten
        uses: actions/github-script@v9
        env:
          LABEL: ${{ github.event.label.name }}
        with:
          script: |
            const label = process.env.LABEL;
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const rules = {
              'already-included': {
                body: '✅ Die gemeldete Domain ist bereits enthalten. Das Issue wird automatisch geschlossen.',
                close: true,
                reason: 'completed'
              },
              'dead-domain': {
                body: '🌐 Die Domain wurde als nicht existent bzw. dauerhaft NXDOMAIN eingestuft. Das Issue wird geschlossen.',
                close: true,
                reason: 'not_planned'
              },
              'duplicate': {
                body: '♻️ Diese Meldung ist ein Duplikat und wird automatisch geschlossen.',
                close: true,
                reason: 'not_planned'
              },
              'invalid-report': {
                body: '⚠️ Für eine reproduzierbare Prüfung fehlen notwendige Angaben. Bitte bei Bedarf ein neues, vollständiges Issue erstellen.',
                close: true,
                reason: 'not_planned'
              },
              'fixed-pending-release': {
                body: '🛠️ Die Änderung ist vorbereitet und für den nächsten Release vorgesehen. Das Issue bleibt bis dahin offen.',
                close: false
              },
              'wontfix': {
                body: 'ℹ️ Diese Änderung wird derzeit nicht übernommen. Das Issue wird als nicht geplant geschlossen.',
                close: true,
                reason: 'not_planned'
              }
            };
            const rule = rules[label];
            if (!rule) {
              core.info(`Kein automatischer Triage-Schritt für Label: ${label}`);
              return;
            }
            await github.rest.issues.createComment({owner, repo, issue_number, body: rule.body});
            if (rule.close) {
              await github.rest.issues.update({owner, repo, issue_number, state: 'closed', state_reason: rule.reason});
            }
