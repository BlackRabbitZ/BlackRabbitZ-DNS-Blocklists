name: Dead domain cleanup

on:
  schedule:
    - cron: '11 3 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur prüfen, nichts entfernen'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mehrfach bestätigte NXDOMAINs final prüfen
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          args=(--required-checks 3 --workers 24 --timeout 2)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 ./scripts/automation/dead_domain_cleanup.py "${args[@]}"

      - name: Profile nach tatsächlicher Bereinigung neu bauen
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        shell: bash
        run: |
          if git diff --quiet -- lists/categories metadata/dns-health-state.json; then
            echo "Keine Domain entfernt."
            exit 0
          fi
          bash ./scripts/update-lists.sh
          python3 ./scripts/validate-generated.py
          git diff --check

      - name: Bereinigung committen
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove repeatedly confirmed dead domains"
          git push
