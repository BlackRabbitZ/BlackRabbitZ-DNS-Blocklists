name: Classifier validation
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 tests/test_classifier.py
      - name: Reclassify cached upstreams
        run: python3 scripts/classify-upstreams.py
      - name: Validate classifier output
        run: python3 scripts/validate-classifier.py
      - name: Build public category lists
        run: python3 scripts/build-categories.py
      - name: Repository validation
        run: python3 scripts/validate-repository.py
      - name: Ensure tracked generated output is synchronized
        shell: bash
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard metadata review sources/classified 2>/dev/null || true)"
          if [[ -n "$untracked" ]]; then
            echo "Notice: new classifier diagnostics/intermediates were generated:"
            printf '%s\n' "$untracked"
          fi
