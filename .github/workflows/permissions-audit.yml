name: Workflow permissions audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '19 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Minimale Workflow-Berechtigungen prüfen
        run: python3 ./scripts/automation/permissions_audit.py
