name: Daily upstream refresh

on:
  schedule:
    # 03:17 UTC daily. An off-hour minute avoids the busiest top-of-hour window.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate upstream configuration
        run: python3 ./scripts/update-upstreams.py --check-config

      - name: Validate profile configuration
        run: python3 -m json.tool config/profiles.json >/dev/null

      - name: Remove Python cache artifacts
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Fetch and merge new upstream domains
        run: python3 ./scripts/update-upstreams.py

      - name: Reject confirmed NXDOMAINs from new upstream additions
        run: |
          python3 ./scripts/automation/new_domain_check.py \
            --diff-range HEAD \
            --remove-nxdomain \
            --max-domains 25000 \
            --workers 32 \
            --timeout 2

      - name: Rebuild profiles, parts, metadata and README
        shell: bash
        run: bash ./scripts/update-lists.sh

      - name: Validate generated diff
        run: git diff --check

      - name: Commit automatic updates
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No upstream changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh upstream blocklists"
          git push
