name: Daily upstream refresh
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: blocklist-upstream-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_BRANCH: automation/upstream-refresh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Validate upstream configuration
        run: python3 ./scripts/update-upstreams.py --check-config
      - name: Refresh per-source raw caches
        run: python3 ./scripts/update-upstreams.py
      - name: Check newly cached domains for confirmed NXDOMAIN
        shell: bash
        run: |
          if [[ -f ./scripts/automation/new_domain_check.py ]]; then
            python3 -m pip install --disable-pip-version-check --quiet "dnspython>=2.6,<3"
            python3 ./scripts/automation/new_domain_check.py --path ./sources/upstream --max-domains 25000 --oversize-policy skip --workers 24 --timeout 2.0
          fi
      - name: Classify upstream domains
        run: python3 ./scripts/classify-upstreams.py
      - name: Validate classifier output
        run: |
          python3 ./tests/test_classifier.py
          python3 ./scripts/validate-classifier.py
      - name: Rebuild categories, profiles, metadata and README
        shell: bash
        run: |
          python3 ./scripts/build-categories.py
          bash ./scripts/update-lists.sh
      - name: Validate repository
        shell: bash
        run: |
          python3 ./scripts/validate-repository.py
          if [[ -f ./scripts/validate-generated.py ]]; then python3 ./scripts/validate-generated.py; fi
          git diff --check
      - name: Create or update review pull request
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then echo "No upstream changes detected."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add -A
          if git diff --cached --quiet; then echo "No changes to propose."; exit 0; fi
          git commit -m "chore: refresh classified upstream blocklists"
          git push --force origin "HEAD:$UPDATE_BRANCH"
          existing_pr="$(gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create --base main --head "$UPDATE_BRANCH" --title "chore: classified upstream blocklist refresh" --body $'Automatisches Upstream-Update mit Domain-Classifier.\n\nRohquellen wurden als Last-Good-Caches aktualisiert. Privacy-/Device-Domains wurden anschließend einzeln klassifiziert; unsichere oder funktionale Kandidaten liegen in `review/classifier-quarantine.tsv`. Entscheidungen und Confidence stehen in `metadata/domain-classification.csv`. Bitte Diff und Quarantäne vor dem Merge prüfen.'
          else
            echo "Updated existing PR #$existing_pr"
          fi
