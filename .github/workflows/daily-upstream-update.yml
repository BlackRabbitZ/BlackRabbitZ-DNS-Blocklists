name: Daily upstream refresh

on:
  schedule:
    # 03:17 UTC daily. An off-hour minute avoids the busiest top-of-hour window.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate upstream configuration
        run: python3 ./scripts/update-upstreams.py --check-config

      - name: Fetch and merge new upstream domains
        run: python3 ./scripts/update-upstreams.py

      - name: Install DNS checker dependency
        run: python3 -m pip install --disable-pip-version-check --quiet "dnspython>=2.6,<3"

      - name: Reject confirmed NXDOMAINs from new upstream additions
        run: |
          python3 ./scripts/automation/new_domain_check.py \
            --path ./lists/categories \
            --max-domains 25000 \
            --oversize-policy skip \
            --workers 24 \
            --timeout 2.0

      - name: Rebuild profiles, parts, metadata and README
        shell: bash
        run: bash ./scripts/update-lists.sh

      - name: Validate generated diff
        shell: bash
        run: |
          git diff --check
          if [[ -f ./scripts/validate-generated.py ]]; then
            python3 ./scripts/validate-generated.py
          fi

      - name: Commit automatic updates
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No upstream changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- README.md README_EN.md lists/categories lists/combined metadata

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh upstream blocklists"
          git push
