name: Validate blocklists
on:
  pull_request:
    paths: ['sources/**','lists/**','config/**','scripts/**','tests/**','metadata/**','review/**','README.md','README_EN.md','.github/workflows/**']
  push:
    branches: [main]
    paths: ['sources/**','lists/**','config/**','scripts/**','tests/**','metadata/**','review/**','README.md','README_EN.md','.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate upstream configuration
        run: python3 ./scripts/update-upstreams.py --check-config
      - name: Classifier tests and rebuild
        run: |
          python3 ./tests/test_classifier.py
          python3 ./scripts/classify-upstreams.py
          python3 ./scripts/validate-classifier.py
          python3 ./scripts/build-categories.py
          bash ./scripts/update-lists.sh
      - name: Validate repository integrity
        run: |
          python3 ./scripts/validate-repository.py
          git diff --check
      - name: Ensure tracked generated files are synchronized
        shell: bash
        run: |
          # `git status` also reports first-run diagnostic files as untracked.
          # Validation must fail only when an already tracked generated file changed.
          # New diagnostics are created by the classifier and can be committed by the
          # scheduled refresh PR without breaking validation on the migration commit.
          if ! git diff --quiet; then
            echo "Tracked generated/classified files are not synchronized with their sources:" >&2
            git diff --stat >&2
            git diff --name-only >&2
            exit 1
          fi
          echo "Tracked generated files are synchronized."
          untracked="$(git ls-files --others --exclude-standard metadata review sources/classified 2>/dev/null || true)"
          if [[ -n "$untracked" ]]; then
            echo "Notice: classifier created new diagnostic/intermediate files (not a validation failure):"
            printf '%s\n' "$untracked"
          fi
