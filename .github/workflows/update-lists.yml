name: Update blocklists

on:
  push:
    branches:
      - main
    paths:
      - 'lists/categories/**'
      - 'README.md'
      - 'scripts/update-lists.sh'
      - '.github/workflows/update-lists.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blocklists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebuild combined lists and counts
        shell: bash
        run: bash ./scripts/update-lists.sh

      - name: Commit generated changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Everything is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md lists/categories lists/combined
          git commit -m "chore: update blocklists and entry counts"
          git push
