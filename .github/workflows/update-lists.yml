name: Update blocklists

on:
  push:
    branches:
      - main
    paths:
      - 'lists/categories/**'
      - 'README.md'
      - 'scripts/update-lists.sh'
      - 'scripts/split-ultimate.py'
      - 'scripts/update-ultimate-readme.py'
      - '.github/workflows/update-lists.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebuild combined lists and counts
        shell: bash
        run: bash ./scripts/update-lists.sh

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Everything is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md lists/categories lists/combined
          git commit -m "chore: update blocklists and entry counts"
          git push
