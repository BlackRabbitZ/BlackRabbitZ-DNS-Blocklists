name: Validate blocklists

on:
  pull_request:
    paths:
      - 'sources/**'
      - 'lists/**'
      - 'config/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'sources/**'
      - 'lists/**'
      - 'config/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate upstream configuration
        run: python3 ./scripts/update-upstreams.py --check-config

      - name: Rebuild generated files locally
        shell: bash
        run: |
          python3 ./scripts/build-categories.py
          bash ./scripts/update-lists.sh

      - name: Validate repository integrity
        run: |
          python3 ./scripts/validate-repository.py
          git diff --check

      - name: Ensure generated files are committed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Generated files are not synchronized with their sources:" >&2
            git status --short >&2
            git diff --stat >&2
            exit 1
          fi
