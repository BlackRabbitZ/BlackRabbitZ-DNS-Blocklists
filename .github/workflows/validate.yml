name: Validate repository

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Welche BlackRabbitZ-Listen sollen geprüft werden?'
        required: true
        default: all
        type: choice
        options:
          - all
          - categories
          - combined
          - ips
          - regex

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BlackRabbitZ Listen prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Python- und Shell-Syntax prüfen
        shell: bash
        run: |
          python3 -m compileall -q scripts
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: JSON- und Upstream-Konfiguration prüfen
        shell: bash
        run: |
          python3 ./scripts/automation/validate_repository.py --scope config --full
          python3 ./scripts/update-upstreams.py --check-config

      - name: '1/4 Kategorie-Blocklisten prüfen'
        if: github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'categories'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 ./scripts/automation/validate_repository.py --scope categories --diff-range "$BASE_SHA...HEAD"
          else
            python3 ./scripts/automation/validate_repository.py --scope categories --full
          fi

      - name: '2/4 Kombinierte Profile prüfen'
        if: github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'combined'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 ./scripts/automation/validate_repository.py --scope combined --diff-range "$BASE_SHA...HEAD"
          else
            python3 ./scripts/automation/validate_repository.py --scope combined --full
          fi

      - name: Generierte Profil-Metadaten prüfen
        if: github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'combined'
        run: python3 ./scripts/validate-generated.py

      - name: '3/4 IP-Blocklisten prüfen'
        if: github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'ips'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 ./scripts/automation/validate_repository.py --scope ips --diff-range "$BASE_SHA...HEAD"
          else
            python3 ./scripts/automation/validate_repository.py --scope ips --full
          fi

      - name: '4/4 RegEx-Blocklisten prüfen'
        if: github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'regex'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 ./scripts/automation/validate_repository.py --scope regex --diff-range "$BASE_SHA...HEAD"
          else
            python3 ./scripts/automation/validate_repository.py --scope regex --full
          fi

      - name: Whitespace-Fehler prüfen
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

  new-domain-dns:
    name: Neue Domains per DNS prüfen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: PR-Branch auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Neu hinzugefügte Domains auf bestätigtes NXDOMAIN prüfen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 ./scripts/automation/new_domain_check.py \
            --diff-range "$BASE_SHA...HEAD" \
            --fail-on-nxdomain \
            --max-domains 25000 \
            --workers 32 \
            --timeout 2 \
            --report /tmp/new-domain-dns.json
      - name: DNS-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-domain-dns-report
          path: /tmp/new-domain-dns.json
          if-no-files-found: ignore
          retention-days: 14
