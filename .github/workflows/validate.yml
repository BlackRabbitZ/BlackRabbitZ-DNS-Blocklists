name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source datasets
        run: python scripts/validate.py
      - name: Build lists
        run: python scripts/build.py
      - name: Run tests
        run: python -m pip install pytest && pytest -q
