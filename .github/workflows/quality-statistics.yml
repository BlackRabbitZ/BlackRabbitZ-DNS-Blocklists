name: Quality & statistics

on:
  schedule:
    # Statistiken täglich
    - cron: '11 6 * * *'
    # Vollständiger Qualitätsbericht dienstags
    - cron: '17 5 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Was soll erzeugt werden?'
        required: true
        default: all
        type: choice
        options:
          - all
          - statistics
          - quality

permissions:
  contents: read

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  statistics:
    name: Listenstatistiken erzeugen
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '11 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'statistics'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Statistiken erzeugen
        run: python3 ./scripts/automation/list_statistics.py
      - name: Änderungen committen
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain STATISTICS.md metadata/statistics.json)" ]]; then
            echo "Statistiken unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATISTICS.md metadata/statistics.json
          git commit -m "chore: update blocklist statistics"
          git push

  quality:
    name: Qualitätsbericht erzeugen
    needs: statistics
    if: >-
      always() &&
      (needs.statistics.result == 'success' || needs.statistics.result == 'skipped') &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 2') ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'quality'))
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Aktuellen Repository-Stand auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Qualitätsbericht erzeugen
        run: python3 ./scripts/automation/quality_report.py
      - name: Bericht als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            QUALITY.md
            metadata/quality.json
          retention-days: 30
      - name: Qualitätsfehler als CI-Fehler markieren
        run: python3 ./scripts/automation/quality_report.py --check
      - name: Bericht committen
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain QUALITY.md metadata/quality.json)" ]]; then
            echo "Qualitätsbericht unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QUALITY.md metadata/quality.json
          git commit -m "chore: update quality report"
          git push
