name: Upstream health

on:
  schedule:
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Upstream-Quellen prüfen
        run: |
          python3 ./scripts/automation/upstream_health.py \
            --output /tmp/upstream-health.json \
            --workers 8 \
            --timeout 20

      - name: Health-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-health
          path: /tmp/upstream-health.json
          if-no-files-found: error
          retention-days: 14
