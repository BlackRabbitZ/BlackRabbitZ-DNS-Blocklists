name: List statistics

on:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Statistiken erzeugen
        run: python3 ./scripts/automation/list_statistics.py

      - name: Änderungen committen
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain STATISTICS.md metadata/statistics.json)" ]]; then
            echo "Statistiken unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATISTICS.md metadata/statistics.json
          git commit -m "chore: update blocklist statistics"
          git push
