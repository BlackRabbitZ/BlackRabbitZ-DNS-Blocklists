name: Actions cleanup

on:
  schedule:
    - cron: '53 3 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, nichts löschen'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Alte abgeschlossene Workflow-Runs bereinigen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          args=(--days 30 --keep 15)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 ./scripts/automation/cleanup_runs.py "${args[@]}"
