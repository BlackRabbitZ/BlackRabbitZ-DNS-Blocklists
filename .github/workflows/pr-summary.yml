name: PR summary

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Pull-Request-Zusammenfassung aktualisieren
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            let additions = 0;
            let deletions = 0;
            const categories = [];
            const workflows = [];
            const scripts = [];
            for (const file of files) {
              additions += file.additions || 0;
              deletions += file.deletions || 0;
              if (file.filename.startsWith('lists/categories/')) categories.push(file.filename);
              if (file.filename.startsWith('.github/workflows/')) workflows.push(file.filename);
              if (file.filename.startsWith('scripts/')) scripts.push(file.filename);
            }
            const marker = '<!-- blackrabbitz-pr-summary -->';
            const fmt = xs => xs.length ? xs.slice(0, 15).map(x => `- \`${x}\``).join('\n') + (xs.length > 15 ? `\n- … ${xs.length - 15} weitere` : '') : '- —';
            const body = `${marker}
            ## 🐇 BlackRabbitZ PR-Zusammenfassung

            | Kennzahl | Wert |
            |---|---:|
            | Geänderte Dateien | ${files.length} |
            | Hinzugefügte Zeilen | +${additions} |
            | Entfernte Zeilen | -${deletions} |
            | Geänderte Kategorie-Dateien | ${categories.length} |
            | Geänderte Workflows | ${workflows.length} |
            | Geänderte Skripte | ${scripts.length} |

            ### Kategorien
            ${fmt(categories)}

            ### Workflows
            ${fmt(workflows)}

            ### Skripte
            ${fmt(scripts)}

            > Die eigentliche Domain-, DNS- und Build-Validierung erfolgt in den separaten CI-Workflows.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100
            });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: pull_number, body});
            }
