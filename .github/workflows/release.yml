name: Weekly release

on:
  schedule:
    - cron: '23 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release nur bei neuen Commits erstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag existiert bereits."
            exit 0
          fi
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$last_tag" ]] && [[ -z "$(git rev-list "$last_tag"..HEAD)" ]]; then
            echo "Keine neuen Commits seit $last_tag."
            exit 0
          fi
          git tag -a "$tag" -m "BlackRabbitZ DNS Blocklists $tag"
          git push origin "$tag"
          assets=()
          [[ -f metadata/SHA256SUMS ]] && assets+=(metadata/SHA256SUMS)
          gh release create "$tag" "${assets[@]}" \
            --title "BlackRabbitZ DNS Blocklists $tag" \
            --generate-notes \
            --verify-tag
