name: DNS maintenance

on:
  schedule:
    # Rotierender Health-Check: Montag 02:43 UTC
    - cron: '43 2 * * 1'
    # Bereinigung mehrfach bestätigter NXDOMAINs: Donnerstag 03:11 UTC
    - cron: '11 3 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Welche DNS-Wartung soll laufen?'
        required: true
        default: all
        type: choice
        options:
          - all
          - health
          - cleanup
      sample_size:
        description: 'Anzahl neuer Stichproben-Domains für den Health-Check'
        required: true
        default: '10000'
        type: string
      dry_run:
        description: 'Cleanup nur prüfen, nichts entfernen'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  health:
    name: DNS-Health prüfen
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '43 2 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'health'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rotierenden DNS-Health-Check ausführen
        env:
          SAMPLE_SIZE: ${{ inputs.sample_size || '10000' }}
        run: |
          python3 ./scripts/automation/dns_health.py \
            --sample-size "$SAMPLE_SIZE" \
            --workers 32 \
            --timeout 2

      - name: DNS-Health-Metadaten committen
        shell: bash
        run: |
          git diff --check
          if [[ -z "$(git status --porcelain metadata/dns-health.json metadata/dns-health-state.json)" ]]; then
            echo "Keine Änderungen am DNS-Health-State."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/dns-health.json metadata/dns-health-state.json
          git commit -m "chore: update DNS health state"
          git push

  cleanup:
    name: Tote Domains bereinigen
    needs: health
    if: >-
      always() &&
      (needs.health.result == 'success' || needs.health.result == 'skipped') &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '11 3 * * 4') ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'cleanup'))
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Aktuellen Repository-Stand auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mehrfach bestätigte NXDOMAINs final prüfen
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          args=(--required-checks 3 --workers 24 --timeout 2)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 ./scripts/automation/dead_domain_cleanup.py "${args[@]}"

      - name: Profile nach tatsächlicher Bereinigung neu bauen
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        shell: bash
        run: |
          if git diff --quiet -- lists/categories metadata/dns-health-state.json; then
            echo "Keine Domain entfernt."
            exit 0
          fi
          bash ./scripts/update-lists.sh
          python3 ./scripts/validate-generated.py
          git diff --check

      - name: Bereinigung committen
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove repeatedly confirmed dead domains"
          git push
