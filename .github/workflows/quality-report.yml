name: Quality report

on:
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blocklist-write-main
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Qualitätsbericht erzeugen
        run: python3 ./scripts/automation/quality_report.py

      - name: Bericht als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            QUALITY.md
            metadata/quality.json
          retention-days: 30

      - name: Qualitätsfehler als CI-Fehler markieren
        run: python3 ./scripts/automation/quality_report.py --check

      - name: Bericht committen
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain QUALITY.md metadata/quality.json)" ]]; then
            echo "Qualitätsbericht unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QUALITY.md metadata/quality.json
          git commit -m "chore: update quality report"
          git push
