name: Domain submission
description: Suggest a domain for inclusion
title: "[Domain] "
labels: ["domain-submission"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: tracker.example.com
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Ads, Tracking, Telemetry, Threat]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Explain what the domain does and how you independently observed it.
    validations:
      required: true
