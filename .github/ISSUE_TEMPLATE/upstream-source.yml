name: Upstream source
about: Suggest a maintained upstream dataset for automatic imports
labels: ["upstream-source"]
body:
  - type: input
    id: name
    attributes:
      label: Source name
      placeholder: Project / feed name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Source URL
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Intended BlackRabbitZ category
      placeholder: malware, trackers, adult...
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License / reuse terms
      placeholder: SPDX identifier or source license page
    validations:
      required: true

  - type: textarea
    id: maintenance
    attributes:
      label: Maintenance and quality notes
      description: How often is it updated, what does it contain, and why is it trustworthy?
    validations:
      required: true

  - type: textarea
    id: format
    attributes:
      label: Feed format
      placeholder: plain domains, hosts, URLs, AdGuard/ABP, wildcard...
    validations:
      required: true
