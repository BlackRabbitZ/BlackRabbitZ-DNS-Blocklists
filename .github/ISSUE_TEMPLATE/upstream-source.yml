name: Upstream-Quelle / Upstream source
description: Schlage einen gepflegten Datensatz für automatische Imports vor / Suggest a maintained upstream dataset for automatic imports
labels: ["upstream-source"]
body:
  - type: input
    id: name
    attributes:
      label: Quellenname / Source name
      placeholder: Projekt- oder Feed-Name / Project or feed name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Quellen-URL / Source URL
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Vorgesehene BlackRabbitZ-Kategorie / Intended BlackRabbitZ category
      placeholder: malware, trackers, adult...
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Lizenz / Nutzungsbedingungen / License / reuse terms
      placeholder: SPDX-Kennung oder Lizenzseite / SPDX identifier or source license page
    validations:
      required: true

  - type: textarea
    id: maintenance
    attributes:
      label: Wartungs- und Qualitätsangaben / Maintenance and quality notes
      description: Wie oft wird die Quelle aktualisiert, was enthält sie und warum ist sie vertrauenswürdig? / How often is it updated, what does it contain, and why is it trustworthy?
    validations:
      required: true

  - type: textarea
    id: format
    attributes:
      label: Feed-Format / Feed format
      placeholder: plain domains, hosts, URLs, AdGuard/ABP, wildcard...
    validations:
      required: true
