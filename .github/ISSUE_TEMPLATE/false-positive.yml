name: False Positive / Fehlklassifizierung
description: Eine Domain wird in einer falschen Liste blockiert oder verursacht Funktionsprobleme.
title: "[False Positive] "
labels: ["false-positive"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: example.com
    validations:
      required: true
  - type: input
    id: list
    attributes:
      label: Betroffene Liste
      placeholder: trackers / android-telemetry / smart-tv
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Was funktioniert nicht?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Gerät / Betriebssystem / Anwendung
  - type: dropdown
    id: disabled_test
    attributes:
      label: Funktioniert es wieder, wenn die Liste deaktiviert wird?
      options: ["Ja", "Nein", "Nicht getestet"]
    validations:
      required: true
